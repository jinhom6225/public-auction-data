# Daily public-auction collector (public_auction_alert plan D30, D28, D29).
# 05:00 KST = 20:00 UTC, plus a 17:00 KST retry slot (plan A12). Order: unit
# tests -> yesterday's `data` branch into prev/ -> same-day check (scheduled
# runs stop if today's KST copy exists) -> collect -> validate -> new orphan
# commit -> force-push `data`.
# A failed step stops the job before the push, so the app keeps yesterday's
# copy (D29 5). The service key lives only in the Collect step's env.
# Never add `set -x` here (D28). Actions are pinned by commit SHA (verified
# with `git ls-remote` in the Phase 2 review); Dependabot proposes updates.
# Every run also (plan A11): a Telegram notice (one-line summary on success,
# run URL on failure; TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID, skipped if unset)
# and a keepalive job that re-enables this workflow so GitHub's 60-day
# inactivity pause never kicks in (the D30 monthly commit stays as well).
name: collect

on:
  schedule:
    - cron: "0 20 * * *"  # 05:00 KST
    # 17:00 KST retry slot (plan A12): collects only when today's KST copy
    # is missing, so a failed or dropped morning run is made up the same day
    # and the app still sees at most one copy per Seoul day.
    - cron: "0 8 * * *"   # 17:00 KST
  workflow_dispatch:
    inputs:
      force_fail:
        description: "Fail before collecting (checks the failure notice)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Forced failure
        if: inputs.force_fail
        run: |
          echo "force_fail=true: failing on purpose to check the Telegram failure notice"
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Unit tests
        run: python3 -m unittest discover collector/tests

      - name: Check out yesterday's data branch into prev/
        id: prev
        run: |
          set +e
          git ls-remote --exit-code --heads origin data > /dev/null
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            git fetch --depth 1 origin data
            git worktree add --detach prev FETCH_HEAD
            echo "mode=prev" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 2 ]; then
            echo "No data branch yet: first run."
            echo "mode=first" >> "$GITHUB_OUTPUT"
          else
            echo "Could not list remote branches (exit $code)."
            exit 1
          fi

      # Plan A12: a second copy on the same Seoul day can make the app drop a
      # held 09:00 alert bundle (plan A10), so a scheduled run stops here when
      # today's copy is already published (the retry slot normally; also a
      # morning run delayed past the retry). Manual runs always collect.
      - name: Retry slot check
        id: retry
        if: github.event_name == 'schedule'
        env:
          PREV_MODE: ${{ steps.prev.outputs.mode }}
        run: |
          today=$(TZ=Asia/Seoul date +%Y-%m-%d)
          if [ "$PREV_MODE" != "prev" ] || [ ! -f prev/v1/index.json ]; then
            echo "Same-day check: no published copy yet, collecting."
            exit 0
          fi
          published=$(python3 -I -c 'import json, sys, datetime as d
          g = json.load(open(sys.argv[1], encoding="utf-8"))["generatedAt"]
          t = d.datetime.fromisoformat(g.replace("Z", "+00:00"))
          print(t.astimezone(d.timezone(d.timedelta(hours=9))).date())' prev/v1/index.json) || published=""
          if [ "$published" = "$today" ]; then
            echo "Same-day check: today's copy ($today KST) is already published; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Same-day check: last copy is from ${published:-unknown}, collecting."
          fi

      # The collector redacts the key from everything it prints; only the
      # "done:" line and the per-API rtms failure counts reach Telegram.
      - name: Collect
        id: collect
        if: steps.retry.outputs.skip != 'true'
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          PREV_MODE: ${{ steps.prev.outputs.mode }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/collect.log"
          started=$(date +%s)
          if [ "$PREV_MODE" = "prev" ]; then
            python3 -m collector.collect --out out --prev prev 2>&1 | tee "$log"
          else
            python3 -m collector.collect --out out --first-run 2>&1 | tee "$log"
          fi
          done_line=$(grep -m1 '^done: ' "$log" | sed 's/^done: //' || true)
          rtms_failed=$( { grep -o '^rtms [a-z]*: .* failed=[0-9]*' "$log" || true; } \
            | sed 's/.*failed=//' | awk '{s+=$1} END {print s+0}')
          minutes=$(( ($(date +%s) - started + 59) / 60 ))
          echo "summary=$done_line rtmsFailed=$rtms_failed minutes=$minutes" >> "$GITHUB_OUTPUT"
          # The log holds the collector's ::add-mask:: lines (key forms); the
          # key must not outlive this step (D28).
          rm -f "$log"

      - name: Validate output
        if: steps.retry.outputs.skip != 'true'
        run: python3 -m collector.validate_output out

      - name: Publish the data branch (one orphan commit, force push)
        if: steps.retry.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          cd out
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v1 cache
          git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push --force "https://github.com/$REPO.git" data:data

      # Keepalive against the 60-day schedule pause (D30): on KST days 1-3,
      # if main has no commit yet this month, record the last success. The
      # data branch is already published, so a rejected push only warns.
      - name: Monthly activity commit on main
        if: steps.retry.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          day=$(TZ=Asia/Seoul date +%d)
          month=$(TZ=Asia/Seoul date +%Y-%m)
          last=$(TZ=Asia/Seoul git log -1 --format=%cd --date=format-local:%Y-%m)
          if [ $((10#$day)) -gt 3 ] || [ "$last" = "$month" ]; then
            echo "Keepalive not needed (KST day $day, last main commit $last)."
            exit 0
          fi
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          printf '# Last successful collection\n\n%s (KST)\n' "$(TZ=Asia/Seoul date +%Y-%m-%dT%H:%M)" > status/last_run.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/last_run.md
          git commit -q -m "chore: record last successful collection" || exit 0
          if ! git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push "https://github.com/$REPO.git" HEAD:main; then
            echo "::warning::Keepalive push to main was rejected; the data branch is published. Retried on the next run (KST day 1-3)."
          fi

      # A skipped retry slot stays quiet; failures and real runs notify.
      - name: Telegram notice
        if: always() && steps.retry.outputs.skip != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ job.status }}
          SUMMARY: ${{ steps.collect.outputs.summary }}
          TRIGGER: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$STATUS" = "success" ]; then
            text="$(printf 'public-auction-data 수집 ✅\n%s\n실행: %s' "${SUMMARY:-요약 없음}" "$TRIGGER")"
          else
            text="$(printf '❌ public-auction-data 수집 실패 (%s, %s)\n%s' "$STATUS" "$TRIGGER" "$RUN_URL")"
          fi
          echo "$text"
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not set; Telegram notices are off"
            exit 0
          fi
          curl --silent --show-error --fail --max-time 15 -o /dev/null \
            -d "chat_id=$TELEGRAM_CHAT_ID" --data-urlencode "text=$text" \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            || echo "::warning::Telegram send failed"

  # Re-enabling an enabled workflow is a no-op that counts as activity, so
  # the schedule is not paused after 60 quiet days (plan A11). Independent
  # of the collect job so it runs even when collecting fails.
  keepalive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api --method PUT "repos/$REPO/actions/workflows/collect.yml/enable" --silent \
            && echo "keepalive: workflow re-enabled" \
            || echo "::warning::keepalive: could not re-enable the workflow"
